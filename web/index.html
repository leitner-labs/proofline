<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proofline — answers you can audit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0b0f14; --card:#131a22; --line:#22303d; --ink:#e8eef4; --dim:#8fa3b3; --ok:#3fb950; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:48px 20px 96px; }
  h1 { font-size:26px; letter-spacing:-.02em; margin:0 0 4px; }
  h1 .dot { color:var(--ok); }
  .sub { color:var(--dim); margin:0 0 32px; }
  form { display:flex; gap:10px; margin-bottom:28px; }
  input { flex:1; padding:13px 15px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; }
  button { padding:13px 20px; border-radius:10px; border:0; background:var(--accent); color:#06121f; font-weight:600; cursor:pointer; }
  .claim { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .claim p { margin:0 0 8px; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .conf { font-size:12px; color:var(--dim); }
  details { margin-top:10px; }
  summary { cursor:pointer; color:var(--accent); font-size:13px; }
  .ev { margin:8px 0 0; padding:10px 12px; border-left:2px solid var(--line); font-size:13px; color:var(--dim); }
  .ev code { color:var(--ink); font-size:12px; display:block; margin-top:3px; white-space:pre-wrap; }
  #status { color:var(--dim); margin:12px 0; min-height:20px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:-16px 0 24px; }
  .chip { font-size:12.5px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--dim); cursor:pointer; font-weight:500; }
  .chip:hover { color:var(--accent); border-color:var(--accent); }
  .badge.mem { color:var(--accent); border-color:var(--accent); }
  #status.err { color:#f85149; }
  footer { color:var(--dim); font-size:12px; margin-top:36px; }
</style>
</head>
<body>
<main>
  <h1>Proofline<span class="dot">.</span></h1>
  <p class="sub">High-stakes answers with a verifiable evidence trail. Every claim links back to the rows it came from.</p>
  <form id="f">
    <input id="q" value="Should Meridian Roast switch its oat-milk supplier, and to whom, and why?" autocomplete="off" aria-label="Question" autofocus>
    <button id="ask">Ask</button>
  </form>
  <div class="chips">
    <button type="button" class="chip">Which supplier has the best on-time record?</button>
    <button type="button" class="chip">Is there recall risk on our current oat milk?</button>
    <button type="button" class="chip">What would switching save per year?</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
  <footer>Memory by Meterless H-MEM · federation + lineage layer Zetaris-shaped · model: NVIDIA Nemotron</footer>
</main>
<script>
const f = document.getElementById('f'), out = document.getElementById('out'), status = document.getElementById('status');
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { document.getElementById('q').value = c.textContent; document.getElementById('f').requestSubmit(); });
const askBtn = document.getElementById('ask');
f.onsubmit = async e => {
  e.preventDefault(); out.innerHTML=''; status.className=''; status.textContent='Thinking and gathering evidence…';
  askBtn.disabled = true;
  let a;
  try {
    const r = await fetch('/api/answer?q=' + encodeURIComponent(document.getElementById('q').value));
    if (!r.ok) throw new Error('server returned ' + r.status);
    a = await r.json();
  } catch (err) {
    status.className='err'; status.textContent = 'Something went wrong: ' + err.message + ' - is the demo server running?';
    askBtn.disabled = false;
    return;
  }
  askBtn.disabled = false;
  status.textContent = a.claims.length + ' verified claims · composed ' + new Date(a.composedAt).toLocaleTimeString();
  for (const c of a.claims) {
    const d = document.createElement('div'); d.className='claim';
    d.innerHTML = `<p></p><div class="meta">
      <span class="badge ${c.text.startsWith('From memory')?'mem':(c.verified?'ok':'')}">${c.text.startsWith('From memory')?'from memory':(c.verified?'verified':'unverified')}</span>
      <span class="conf">confidence ${c.confidence}</span>
      <span class="conf">${c.evidence.length} evidence ref${c.evidence.length===1?'':'s'}</span></div>
      <details><summary>Show evidence trail</summary></details>`;
    d.querySelector('p').textContent = c.text;
    const det = d.querySelector('details');
    for (const ev of c.evidence) {
      const e = document.createElement('div'); e.className='ev';
      e.innerHTML = `<b></b> · rows <span class="rows"></span> · lineage <span class="lin"></span><br><span class="ts"></span><code></code>`;
      e.querySelector('b').textContent = ev.source;
      e.querySelector('.rows').textContent = ev.rowIds.slice(0,6).join(', ') + (ev.rowIds.length>6?'…':'');
      e.querySelector('.lin').textContent = ev.lineageId;
      e.querySelector('.ts').textContent = ev.retrievedAt;
      e.querySelector('code').textContent = ev.query;
      det.appendChild(e);
    }
    out.appendChild(d);
  }
};
</script>
</body>
</html>
